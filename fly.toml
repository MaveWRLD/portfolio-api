app = "portfolio-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_SETTINGS_MODULE = "config.settings.prod"
  DEBUG = "False"
  ADMIN_URL = "admin/"
  # Set these via `fly secrets set`:
  # DJANGO_SECRET_KEY
  # POSTGRES_PASSWORD
  # AWS_S3_ACCESS_KEY_ID
  # AWS_S3_SECRET_ACCESS_KEY
  # AWS_STORAGE_BUCKET_NAME
  # AWS_S3_ENDPOINT_URL
  # CORS_ALLOWED_ORIGINS

[processes]
  web = "gunicorn config.wsgi:application --bind 0.0.0.0:8080 --workers 3 --timeout 60"
  release = "python manage.py migrate --noinput"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["web"]

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[metrics]
  port = 9091