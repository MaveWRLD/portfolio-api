[project]
name = "portfolio-api"
version = "0.1.0"
description = "Django REST API for backend developer portfolio"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.4",
    "django-filter>=24.2",
    "whitenoise>=6.6",
    "python-dotenv>=1.0",
    "gunicorn>=22.0",
    "psycopg2-binary>=2.9",
    "drf-spectacular>=0.27",
    "pillow>=10.0",
    "django-debug-toolbar>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "black>=24.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "apps*"]
exclude = ["media*", "scripts*", "*.tests", "*.tests.*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "DJ", "T20"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
python_files = ["test_*.py", "tests.py"]